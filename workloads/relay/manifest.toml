# Lab workload relay, part (i): two shell seats that exchange a message on the managed bus.
# `ping` publishes "ping <n>" on agent.lab.relay.ping every 5 seconds and logs what it
# hears on agent.lab.relay.pong to ${LAB_STATE:-$HOME/lab-run}/relay/<session>.log. `pong`
# listens on agent.lab.relay.ping, logs "<session> heard ping <n>" to its own file in the
# same directory, and answers "pong <n>" on agent.lab.relay.pong. The subjects sit inside
# agent.<workspace>.<team>.>, the only space a seat user may use on the managed bus.
# Both use the nats command line tool against RELAY_URL (default NATS_URL, then
# nats://127.0.0.1:4222). Credentials come from the seat's own environment: each call reads
# the password from the file named by DIRECTOR_NATS_PASS_FILE and hands it to nats as
# NATS_PASSWORD, in that one process's environment only. The value is never put on a
# command line or written to a log. See README.md.

[workspace]
name = "lab"

[[team]]
name = "relay"

  [[team.role]]
  name = "pong"
  replicas = 1
  restart_policy = "always"

    [team.role.runtime]
    image = "shell"
    command = "sh"
    args = ["-c", '''u="${RELAY_URL:-${NATS_URL:-nats://127.0.0.1:4222}}"
d="${RELAY_DIR:-${LAB_STATE:-$HOME/lab-run}/relay}"
mkdir -p "$d"
cred() {
  if [ ! -r "${DIRECTOR_NATS_PASS_FILE:-}" ]; then echo "relay: no readable DIRECTOR_NATS_PASS_FILE" >&2; return 1; fi
  NATS_USER="${DIRECTOR_NATS_USER:-}"
  NATS_PASSWORD="$(cat "$DIRECTOR_NATS_PASS_FILE")"
  export NATS_USER NATS_PASSWORD
}
bus() { ( cred || exit 1; exec nats --no-context --server "$u" "$@" ); }
bus sub --raw agent.lab.relay.ping | while read -r line; do
  [ -n "$line" ] || continue
  echo "$MARVEL_SESSION heard $line" >> "$d/$MARVEL_SESSION.log"
  bus pub agent.lab.relay.pong "pong ${line#ping }" > /dev/null
done
''']

  [[team.role]]
  name = "ping"
  replicas = 1
  restart_policy = "always"

    [team.role.runtime]
    image = "shell"
    command = "sh"
    args = ["-c", '''u="${RELAY_URL:-${NATS_URL:-nats://127.0.0.1:4222}}"
d="${RELAY_DIR:-${LAB_STATE:-$HOME/lab-run}/relay}"
mkdir -p "$d"
cred() {
  if [ ! -r "${DIRECTOR_NATS_PASS_FILE:-}" ]; then echo "relay: no readable DIRECTOR_NATS_PASS_FILE" >&2; return 1; fi
  NATS_USER="${DIRECTOR_NATS_USER:-}"
  NATS_PASSWORD="$(cat "$DIRECTOR_NATS_PASS_FILE")"
  export NATS_USER NATS_PASSWORD
}
bus() { ( cred || exit 1; exec nats --no-context --server "$u" "$@" ); }
( cred || exit 1; exec nats --no-context --server "$u" sub --raw agent.lab.relay.pong ) >> "$d/$MARVEL_SESSION.log" &
p=$!
trap 'kill "$p" 2>/dev/null' EXIT
n=0
while true; do
  n=$((n + 1))
  bus pub agent.lab.relay.ping "ping $n" > /dev/null
  if [ -n "${RELAY_MAX:-}" ] && [ "$n" -ge "$RELAY_MAX" ]; then break; fi
  sleep "${RELAY_INTERVAL:-5}"
done
sleep "${RELAY_DRAIN:-0}"
''']
