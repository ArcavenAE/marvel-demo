# lab.lock: what the check harness (lab/run) compares against.
#
#   version <name> <expected> <command words...>
#     The command is run as written (no shell); its first output line must
#     contain <expected>. A different or missing version prints a WARN and does
#     not fail the run.
#
#   `release <name> <tag>`
#     The release a rung expects (for example `release director-mcp <tag>`).
#     lab/run ignores this line; the check for that rung reads it. With no
#     line, the rung reads SKIP and says what is missing.
#
#   digest <path> <sha256>
#     The sha256 of a check script, or of lab/report or lab/verify-report. A
#     file whose digest differs, or that has no line here, FAILs and is not
#     run. `lab/run digests` prints the lines.
#
#   workload <name> <sha256>
#     The sha256 of a workload the lab runs; lab/report copies these lines
#     into a report. Nothing is pinned yet.
#
# No versions are pinned yet; they arrive with the rungs.
